[project]
name = "tiny-aeb-ml"
version = "0.1.0"
description = "Post-train a tiny LM to make toy AEB decisions on CPU, as a learning project."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate==1.15.0",
    "datasets==5.1.0",
    "pyyaml==6.0.3",
    "torch==2.15.0",
    "transformers==5.22.2",
    "trl==1.17.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

# CPU-only torch wheels: the default PyPI torch wheel bundles CUDA libraries we never use.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["tiny_aeb_ml"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["slow: loads a model or runs training"]
addopts = "-m 'not slow'"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]
